services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
    container_name: igavuba-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      SERVER_API_URL: ${SERVER_API_URL:-http://host.docker.internal:4000/api}
    extra_hosts:
      - "host.docker.internal:host-gateway"
